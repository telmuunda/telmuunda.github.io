name: Refresh monthly physics and astronomy news

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh news data
        run: python scripts/update_physics_news.py
      - name: Commit updated news
        run: |
          if git diff --quiet -- assets/data/physics-news.json; then
            echo "Monthly news has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/physics-news.json
          git commit -m "Refresh monthly physics and astronomy news"
          git push