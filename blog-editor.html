<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Blog editor | Telmuun Davaadalai</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<style>
		:root { color-scheme: light dark; --bg: #0a0a0a; --panel: rgba(255, 255, 255, .04); --text: #f5f3ee; --muted: #beb8ab; --line: rgba(255, 255, 255, .12); --accent: #9de2cb; }
		@media (prefers-color-scheme: light) { :root { --bg: #fff; --panel: #fff; --text: #111; --muted: #5d5d5d; --line: rgba(17, 17, 17, .12); --accent: #0f6c4e; } }
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 Inter, "Segoe UI", Helvetica, sans-serif; }
		h1 { margin: 0; font-size: 2rem; line-height: 1.2; }
		a { color: var(--accent); }
		.eyebrow { margin-bottom: .45rem; color: var(--accent); font-size: .78rem; font-weight: 700; text-transform: uppercase; }
		.editor-shell { max-width: 1080px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
		.editor-header { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 2rem; }
		.editor-header h1 { margin: 0; }
		.editor-header a { color: var(--accent); }
		.editor-form { display: grid; gap: 1rem; }
		.editor-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
		.editor-field { display: grid; gap: .45rem; }
		.editor-field label, .editor-label { color: var(--text); font-size: .9rem; font-weight: 600; }
		.editor-field input, .editor-field textarea, .editor-content {
			width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
			color: var(--text); padding: .8rem; font: inherit;
		}
		.editor-field textarea { min-height: 5rem; resize: vertical; }
		.editor-toolbar { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
		.editor-toolbar button, .editor-actions button {
			border: 1px solid var(--line); border-radius: 6px; padding: .55rem .8rem; background: var(--panel);
			color: var(--text); font: inherit; cursor: pointer;
		}
		.editor-toolbar button:hover, .editor-actions button:hover { border-color: var(--accent); }
		.editor-content { min-height: 360px; line-height: 1.65; overflow-wrap: anywhere; }
		.editor-content:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
		.editor-content:empty::before { content: attr(data-placeholder); color: var(--muted); }
		.editor-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
		.editor-actions button[type="submit"] { background: var(--accent); color: #10231f; border-color: var(--accent); font-weight: 700; }
		#publish-status { color: var(--muted); }
		@media (max-width: 640px) { .editor-shell { padding: 2rem 1rem 3rem; } .editor-fields { grid-template-columns: 1fr; } .editor-header { align-items: start; flex-direction: column; } }
	</style>
</head>
<body>
	<main class="editor-shell">
		<div class="editor-header">
			<div><div class="eyebrow">Local publishing</div><h1>Write a blog post</h1></div>
			<a href="blog.html">View blog</a>
		</div>
		<p>This editor saves posts to your local repository. It does not publish directly to GitHub.</p>
		<form class="editor-form" id="post-form">
			<div class="editor-fields">
				<div class="editor-field"><label for="post-title">Title</label><input id="post-title" name="title" maxlength="120" required /></div>
				<div class="editor-field"><label for="post-date">Publication date (local)</label><input id="post-date" name="date" type="date" required /></div>
			</div>
			<div class="editor-field"><label for="post-summary">Short summary</label><textarea id="post-summary" name="summary" maxlength="260" required></textarea></div>
			<div class="editor-field">
				<span class="editor-label" id="body-label">Post</span>
				<div class="editor-toolbar" role="toolbar" aria-label="Text formatting">
					<button type="button" data-command="bold" aria-label="Bold"><strong>B</strong></button>
					<button type="button" data-command="italic" aria-label="Italic"><em>I</em></button>
					<button type="button" data-command="formatBlock" data-value="h2">Heading</button>
					<button type="button" data-command="formatBlock" data-value="p">Paragraph</button>
					<button type="button" data-command="insertUnorderedList">Bullet list</button>
					<button type="button" data-command="createLink">Link</button>
				</div>
				<div class="editor-content" id="post-body" contenteditable="true" role="textbox" aria-labelledby="body-label" aria-multiline="true" data-placeholder="Write your article here..."></div>
			</div>
			<div class="editor-actions"><button type="submit">Publish to this repository</button><span id="publish-status" role="status" aria-live="polite"></span></div>
		</form>
	</main>
	<script>
		const body = document.getElementById('post-body');
		const publishButton = document.querySelector('#post-form button[type="submit"]');
		const status = document.getElementById('publish-status');
		const isLocalEditor = ['localhost', '127.0.0.1'].includes(window.location.hostname)
			&& window.location.port === '8765';
		if (!isLocalEditor) {
			publishButton.disabled = true;
			status.textContent = 'Publishing works only from the local editor. Run "python3 scripts/blog_editor.py", then open http://127.0.0.1:8765/blog-editor.html.';
		}
		document.querySelectorAll('.editor-toolbar button').forEach((button) => {
			button.addEventListener('click', () => {
				body.focus();
				if (button.dataset.command === 'createLink') {
					const url = window.prompt('Link URL (https://...)');
					if (!url) return;
					document.execCommand('createLink', false, url);
					return;
				}
				document.execCommand(button.dataset.command, false, button.dataset.value || null);
			});
		});
		const postDateInput = document.getElementById('post-date');
		const setPostDateToToday = () => {
			const now = new Date();
			postDateInput.value = [
				now.getFullYear(),
				String(now.getMonth() + 1).padStart(2, '0'),
				String(now.getDate()).padStart(2, '0'),
			].join('-');
		};
		setPostDateToToday();
		document.getElementById('post-form').addEventListener('submit', async (event) => {
			event.preventDefault();
			if (!isLocalEditor) return;
			const formElement = event.currentTarget;
			const form = new FormData(formElement);
			status.textContent = 'Publishing...';
			try {
				const response = await fetch(`${window.location.origin}/publish`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ title: form.get('title'), date: form.get('date'), summary: form.get('summary'), body: body.innerHTML })
				});
				const responseText = await response.text();
				let result;
				try {
					result = JSON.parse(responseText);
				} catch {
					throw new Error(`The local publishing server returned an unexpected response (HTTP ${response.status}). Start it with "python3 scripts/blog_editor.py" and open http://127.0.0.1:8765/blog-editor.html.`);
				}
				if (!response.ok) throw new Error(result.error || 'Could not publish post.');
				status.textContent = `Published ${result.path}. The new post is now in your local repository.`;
				formElement.reset();
				body.replaceChildren();
				setPostDateToToday();
			} catch (error) {
				status.textContent = error instanceof Error ? error.message : 'Could not publish the post.';
			}
		});
	</script>
</body>
</html>
